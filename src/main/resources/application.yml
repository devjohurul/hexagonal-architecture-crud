spring:
  application:
    name: hexagonal-architecture-crud

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/hexagonal_architecture_crud
    username: postgres
    password: root

  jpa:
    properties:
      hibernate:
        jdbc:
          time-zone: UTC
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
